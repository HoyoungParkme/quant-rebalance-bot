[project]
name = "qbot"
version = "0.1.0"
description = "퀀트 리밸런싱 봇. 명세: docs/specs (QBOT)"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
qbot = "app.entry.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
